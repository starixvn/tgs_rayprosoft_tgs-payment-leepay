syntax = "proto3";

option csharp_namespace = "Tgs.Payment.LeePay";
package leepay;

message DepositRequest {
	string system_id = 1;
	string system_key = 2;
	string custom_order_no = 3;
	string amount = 4;
	string return_url = 5;
	string channel_currency = 6;
	optional string channel = 7;
}

message DepositResponse {
	string code = 1;
	optional string message = 2;
	string order_id = 3;
	string order_no = 4;
	string custom_order_no = 5;
	string wallet_address = 6;
	string payment_url = 7;
	string usdt_amount = 8;
	string channel_currency = 9;
	string channel_rate = 10;
	string channel = 11;
}
